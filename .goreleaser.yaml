version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/dpuwork/aitop/internal/ui.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:", "^chore:"]

brews:
  - repository:
      owner: dpuwork
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dpuwork/aitop
    description: "TUI for AI coding tool usage: Claude Code, OpenCode Go, Codex"
    install: |
      bin.install "aitop"
    test: |
      system "#{bin}/aitop", "--version"
